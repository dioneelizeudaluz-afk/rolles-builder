<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rolles — AI Builder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #07110d;
      color: #f4fff8;
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(7,17,13,.88);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #20d879;
      color: #041009;
      font-weight: 900;
    }

    .menu-button {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: white;
      font-size: 24px;
    }

    .menu-button:hover {
      background: rgba(32,216,121,.12);
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 60px;
      right: 18px;
      width: 220px;
      padding: 8px;
      background: #102019;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: none;
      z-index: 50;
    }

    .menu.open {
      display: block;
    }

    .menu button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #dce9e2;
      text-align: left;
    }

    .menu button:hover {
      background: rgba(32,216,121,.1);
      color: white;
    }

    /* MAIN */

    main {
      flex: 1;
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 70px 20px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    .badge {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(32,216,121,.09);
      border: 1px solid rgba(32,216,121,.2);
      color: #71efad;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.05;
      letter-spacing: -2.5px;
      margin-bottom: 14px;
    }

    .gradient {
      color: #20d879;
    }

    .subtitle {
      max-width: 620px;
      margin: auto;
      color: #91a49a;
      font-size: 17px;
      line-height: 1.6;
    }

    /* PROMPT */

    .prompt-box {
      width: 100%;
      max-width: 760px;
      background: #0d1b14;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 16px;
      box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.03);
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #63766c;
    }

    .prompt-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .hint {
      color: #65776e;
      font-size: 13px;
    }

    .generate {
      border: 0;
      border-radius: 13px;
      padding: 12px 18px;
      background: #20d879;
      color: #041009;
      font-weight: 800;
      transition: .2s;
    }

    .generate:hover {
      transform: translateY(-1px);
      background: #38e58c;
    }

    .generate:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    /* SUGGESTIONS */

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
    }

    .suggestion {
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: #aebdb5;
      font-size: 13px;
    }

    .suggestion:hover {
      border-color: rgba(32,216,121,.35);
      color: white;
    }

    /* OUTPUT */

    #output {
      width: 100%;
      max-width: 760px;
      margin-top: 24px;
      white-space: pre-wrap;
      color: #9eb0a7;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    /* EDITOR */

    #editor {
      width: 100%;
      max-width: 1200px;
      padding: 25px;
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 15px;
    }

    .panel {
      background: #0d1b14;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .panel-title {
      padding: 13px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      font-weight: 700;
    }

    #fileList {
      padding: 8px;
    }

    .file-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #aabbb2;
      padding: 10px;
      text-align: left;
      border-radius: 9px;
    }

    .file-item:hover {
      background: rgba(32,216,121,.09);
      color: white;
    }

    #codeEditor {
      width: 100%;
      min-height: 500px;
      border: 0;
      outline: 0;
      resize: vertical;
      padding: 18px;
      background: #07100c;
      color: #d9e7df;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .editor-top {
      padding: 13px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-button {
      border: 0;
      border-radius: 9px;
      padding: 8px 12px;
      background: #20d879;
      color: #041009;
      font-weight: 700;
    }

    /* RESPONSIVE */

    @media (max-width: 700px) {
      main {
        padding-top: 48px;
      }

      .prompt-bottom {
        align-items: flex-end;
        gap: 10px;
      }

      .hint {
        display: none;
      }

      .editor-layout {
        grid-template-columns: 1fr;
      }

      #editor {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">
      <div class="logo-mark">R</div>
      <span>Rolles</span>
    </div>

    <button
      id="menuButton"
      class="menu-button"
      aria-label="Menu"
    >
      ⋮
    </button>

    <div id="menu" class="menu">
      <button id="newProject">Novo projeto</button>
      <button>Meus projetos</button>
      <button>Histórico</button>
      <button>Configurações</button>
      <button>Minha conta</button>
    </div>
  </header>

  <!-- HOME -->

  <main id="home">

    <div class="hero">

      <div class="badge">
        AI APP BUILDER
      </div>

      <h1>
        O que vamos
        <span class="gradient">criar hoje?</span>
      </h1>

      <p class="subtitle">
        Descreva a sua ideia e o Rolles transforma-a
        em um projeto digital.
      </p>

    </div>

    <div class="prompt-box">

      <textarea
        id="prompt"
        placeholder="Ex: Crie um aplicativo de entregas para Maputo com clientes, pedidos, entregadores e painel de administração..."
      ></textarea>

      <div class="prompt-bottom">

        <span class="hint">
          Descreva o que deseja criar
        </span>

        <button
          id="generate"
          class="generate"
        >
          Criar projeto
        </button>

      </div>

    </div>

    <div class="suggestions">

      <button class="suggestion"
        data-prompt="Crie um SaaS moderno para pequenas empresas.">
        Criar SaaS
      </button>

      <button class="suggestion"
        data-prompt="Crie um site profissional e moderno para uma empresa.">
        Criar site
      </button>

      <button class="suggestion"
        data-prompt="Crie um aplicativo mobile-first moderno.">
        Criar app
      </button>

      <button class="suggestion"
        data-prompt="Crie um mini jogo web divertido e responsivo.">
        Criar jogo
      </button>

    </div>

    <div id="output"></div>

  </main>

  <!-- EDITOR -->

  <section
    id="editor"
    class="hidden"
  >

    <div class="editor-layout">

      <div class="panel">

        <div class="panel-title">
          Arquivos
        </div>

        <div id="fileList"></div>

      </div>

      <div class="panel">

        <div class="editor-top">

          <span id="currentFileName">
            Nenhum arquivo
          </span>

          <button
            id="saveFile"
            class="save-button"
          >
            Salvar
          </button>

        </div>

        <textarea
          id="codeEditor"
          spellcheck="false"
          placeholder="O código aparecerá aqui..."
        ></textarea>

        <div style="padding:15px;">
          <h3 style="margin-bottom:10px;">
            Preview
          </h3>

          <iframe
            id="previewFrame"
            title="Preview"
            style="
              width:100%;
              height:500px;
              border:1px solid #26352d;
              border-radius:12px;
              background:white;
            "
          ></iframe>

          <button
            id="runPreview"
            class="generate"
            style="margin-top:12px;"
          >
            Executar Preview
          </button>

        </div>

      </div>

    </div>

  </section>

</div>

<script>

  const $ = (selector) =>
    document.querySelector(selector);

  const menuButton =
    $("#menuButton");

  const menu =
    $("#menu");

  const prompt =
    $("#prompt");

  /* MENU */

  menuButton.addEventListener(
    "click",
    () => {
      menu.classList.toggle("open");
    }
  );

  document.addEventListener(
    "click",
    (event) => {

      if (
        !menu.contains(event.target) &&
        !menuButton.contains(event.target)
      ) {
        menu.classList.remove("open");
      }

    }
  );

  /* SUGESTÕES */

  document
    .querySelectorAll(".suggestion")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          prompt.value =
            button.dataset.prompt;

          prompt.focus();

        }
      );

    });

  /* EDITOR */

  let currentProject = null;
  let currentFile = null;

  function openEditor(project) {

    currentProject = project;

    $("#home")
      .classList.add("hidden");

    $("#editor")
      .classList.remove("hidden");

    renderFiles();

  }

  function renderFiles() {

    const fileList =
      $("#fileList");

    fileList.innerHTML = "";

    const files =
      currentProject?.files || [];

    files.forEach(
      (file, index) => {

        const button =
          document.createElement("button");

        button.className =
          "file-item";

        button.textContent =
          "📄 " + file.path;

        button.onclick = () =>
          openFile(file);

        fileList.appendChild(
          button
        );

        if (index === 0) {
          openFile(file);
        }

      }
    );

  }

  function openFile(file) {

    currentFile = file;

    $("#currentFileName")
      .textContent =
      file.path;

    $("#codeEditor")
      .value =
      file.content || "";

  }

  /* GERAR */

  $("#generate")
    .addEventListener(
      "click",
      async () => {

        const text =
          prompt.value.trim();

        if (!text) {

          $("#output")
            .textContent =
            "Escreva uma ideia primeiro.";

          return;

        }

        const button =
          $("#generate");

        button.disabled = true;

        button.textContent =
          "A criar...";

        $("#output")
          .textContent =
          "O Rolles está a construir o projeto...";

        try {

          const response =
            await fetch(
              "/api/generate",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    prompt: text
                  })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {
            throw new Error(
              data.error ||
              "Erro ao gerar projeto."
            );
          }

          if (!data.project) {
            throw new Error(
              "A IA não retornou um projeto."
            );
          }

          currentProject =
            data.project;

          localStorage.setItem(
            "rolles_current_project",
            JSON.stringify(
              currentProject
            )
          );

          $("#output")
            .textContent =
            "Projeto criado com sucesso.";

          openEditor(
            currentProject
          );

        } catch (error) {

          console.error(error);

          $("#output")
            .textContent =
            "Erro: " +
            error.message;

        } finally {

          button.disabled =
            false;

          button.textContent =
            "Criar projeto";

        }

      }
    );

  /* SALVAR */

  $("#saveFile")
    .addEventListener(
      "click",
      () => {

        if (
          !currentProject ||
          !currentFile
        ) return;

        currentFile.content =
          $("#codeEditor").value;

        localStorage.setItem(
          "rolles_current_project",
          JSON.stringify(
            currentProject
          )
        );

      }
    );

  /* PREVIEW */

  $("#runPreview")
    .addEventListener(
      "click",
      () => {

        if (!currentProject) {
          return;
        }

        const files =
          currentProject.files || [];

        const htmlFile =
          files.find(
            file =>
              file.path ===
              "index.html"
          );

        if (!htmlFile) {

          $("#output")
            .textContent =
            "Este projeto ainda não possui um index.html.";

          return;

        }

        $("#previewFrame")
          .srcdoc =
          htmlFile.content || "";

      }
    );

  /* NOVO PROJETO */

  $("#newProject")
    .addEventListener(
      "click",
      () => {

        menu.classList.remove(
          "open"
        );

        $("#editor")
          .classList.add(
            "hidden"
          );

        $("#home")
          .classList.remove(
            "hidden"
          );

        prompt.value = "";

      }
    );

</script>

</body>
    </html>
